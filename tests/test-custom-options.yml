name: Test custom options with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom options and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          tf_scope: 'public'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          tmt_plan_regex: '/plans/smoke'
          tmt_context: 'arch=x86_64'
          tmt_path: '.'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          variables: 'VAR1=value1;VAR2=value2'
          copr_artifacts: ''
          create_issue_comment: 'false'
          update_pull_request_status: 'false'
          create_github_summary: 'false'
          timeout: '5'

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key and custom options"
