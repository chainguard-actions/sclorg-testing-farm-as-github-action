name: Test additional inputs (pool, repo_name, commit_sha, tmt_plan_filter)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          pool: 'default'
          repo_name: 'testing-farm-as-github-action'
          commit_sha: 'abc1234def5678901234567890abcdef12345678'
          tmt_plan_filter: 'tag:tier1'
          create_github_summary: 'false'
          timeout: '1'

      - name: Assert action ran with additional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid API key the action is expected to fail.
          # We just verify it ran (not skipped) and produced a deterministic outcome.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with pool, repo_name, commit_sha, and tmt_plan_filter inputs"
