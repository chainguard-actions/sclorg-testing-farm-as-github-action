name: Test invalid API key handling
on:
  workflow_dispatch:

jobs:
  test-invalid-api-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid API key (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/actions/checkout'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key"
