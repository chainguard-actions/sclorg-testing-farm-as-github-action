name: Test pull request event scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: dummy-api-key-for-testing
          api_url: https://api.dev.testing-farm.io/v0.1
          git_url: https://github.com/sclorg/testing-farm-as-github-action
          git_ref: main
          compose: Fedora-latest
          arch: x86_64
          pr_number: '1'
          commit_sha: 'abc1234567890abcdef1234567890abcdef12345'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
          timeout: '1'

      - name: Assert action ran for pull request scenario
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (invalid API key / network error), not be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran and produced outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
