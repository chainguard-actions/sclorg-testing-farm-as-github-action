name: Test pull request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_SERVER_URL: 'https://github.com'
      GITHUB_REPOSITORY: 'sclorg/testing-farm-as-github-action'
      GITHUB_REPOSITORY_OWNER: 'sclorg'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'test-invalid-key'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          pr_number: '1'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
          timeout: '5'
      - name: Assert action ran in PR context
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran in PR context, outcome: ${{ steps.action.outcome }}"
