name: Test private scope with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          tf_scope: 'private'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'RHEL-9.0'
          arch: 'x86_64'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          timeout: '1'

      - name: Assert action ran and failed due to API error (not a JS crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (invalid API key), not succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid API key in private scope, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key in private scope (outcome=$OUTCOME)"
