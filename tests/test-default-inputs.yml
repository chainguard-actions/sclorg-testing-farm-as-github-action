name: Test default input values applied
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action uses default values for optional inputs.
      # With only api_key provided (and an invalid one), the action should
      # fail at the API authentication stage (not at input validation),
      # confirming that all required defaults were applied successfully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'test-key-defaults-check'
          # All other inputs use defaults:
          # api_url: https://api.dev.testing-farm.io/v0.1
          # git_url: ${{ github.server_url }}/${{ github.repository }}
          # git_ref: ${{ github.ref }}
          # compose: Fedora-latest
          # arch: x86_64
          # create_github_summary: true
          create_github_summary: 'false'

      - name: Assert action failed at API level (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is invalid,
          # not because of missing required inputs.
          # A failure here means defaults were applied and the action
          # reached the API call stage.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API auth error), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed at API level, confirming defaults were applied"
