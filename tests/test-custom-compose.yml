name: Test custom compose and architecture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify dist/index.js exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/dist/index.js" ]; then
            echo "FAIL: dist/index.js not found"
            exit 1
          fi
          echo "PASS: dist/index.js exists"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'fake-api-key-for-testing'
          git_url: 'https://github.com/example/repo'
          git_ref: 'main'
          compose: 'CentOS-Stream-9'
          arch: 'aarch64'
          tmt_plan_regex: '/plans/basic'
          variables: 'VAR1=value1;VAR2=value2'
          timeout: '5'

      - name: Assert action ran with custom compose settings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom compose/arch, outcome=$OUTCOME"
