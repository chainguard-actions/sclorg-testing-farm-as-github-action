name: Test default input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_SERVER_URL: 'https://github.com'
      GITHUB_REPOSITORY: 'sclorg/testing-farm-as-github-action'
      GITHUB_REPOSITORY_OWNER: 'sclorg'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'test-invalid-key'
          # All other inputs use defaults:
          # api_url defaults to https://api.dev.testing-farm.io/v0.1
          # compose defaults to Fedora-latest
          # arch defaults to x86_64
          # timeout defaults to 480
          timeout: '5'
      - name: Assert action ran with defaults
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should run (not be skipped) even with an invalid key
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with default inputs, outcome: ${{ steps.action.outcome }}"
