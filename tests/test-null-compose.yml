name: Test null compose value for container provisioner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts "null" as a compose value.
      # According to the action docs: Use "null" to skip compose specification
      # - needed for container provisioner with image specified in plan.
      # The action will fail at API auth (invalid key), but if it reaches
      # that point, the "null" compose value was handled correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'test-key-null-compose'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'null'
          arch: 'x86_64'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'

      - name: Assert action failed at API level (null compose was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API auth error), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted null compose value and failed at API level as expected"
