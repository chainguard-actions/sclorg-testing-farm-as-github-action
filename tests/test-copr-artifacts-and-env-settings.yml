name: Test copr artifacts and environment settings inputs
on:
  workflow_dispatch:

jobs:
  test-copr-artifacts-env-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with copr_artifacts and environment_settings (expect failure due to invalid API key)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/actions/checkout'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          copr_artifacts: 'fedora-copr-build:12345;fedora-copr-build:67890'
          environment_settings: '{"post-install-script": "dnf install -y vim"}'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'

      - name: Assert action failed as expected (inputs were parsed, API key rejected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with copr_artifacts and environment_settings parsed"
