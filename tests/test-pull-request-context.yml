name: Test pull request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/42/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action in pull request context (expect failure due to fake key)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          api_url: https://api.dev.testing-farm.io/v0.1
          git_url: https://github.com/teemtee/tmt
          git_ref: main
          compose: Fedora-latest
          arch: x86_64
          pr_number: '42'
          commit_sha: 'abc1234567890abcdef1234567890abcdef12345'
          pull_request_status_name: 'Testing Farm'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
          create_github_summary: 'false'
          timeout: '5'

      - name: Assert action ran in PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome in PR context"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
