name: Test pull request context with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/42/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in pull request context and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'feature-branch'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          pr_number: '42'
          commit_sha: 'abc1234def5678901234567890abcdef12345678'
          repo_owner: 'sclorg'
          repo_name: 'testing-farm-as-github-action'
          pull_request_status_name: 'Testing Farm'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
          create_github_summary: 'false'
          timeout: '5'

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key in PR context, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key in pull request context"
