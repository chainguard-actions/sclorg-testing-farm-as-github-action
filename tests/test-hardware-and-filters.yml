name: Test hardware requirements and plan filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          api_url: https://api.dev.testing-farm.io/v0.1
          git_url: https://github.com/sclorg/testing-farm-as-github-action
          git_ref: main
          compose: Fedora-latest
          arch: x86_64
          tmt_plan_regex: /plans/smoke/
          tmt_plan_filter: 'tag:smoke'
          tmt_hardware: '{"memory": "8 GB", "cpu": {"processors": 2}}'
          repo_name: testing-farm-as-github-action
          pr_number: '42'
          commit_sha: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
          timeout: '5'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
      - name: Assert action ran with hardware and filter inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Request ID: ${{ steps.action.outputs.request_id }}"
          # The action is expected to fail with a fake API key
          # We just verify it ran and produced some output or failed gracefully
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran to completion with hardware and filter inputs"
          else
            echo "FAIL: action did not run"
            exit 1
          fi
