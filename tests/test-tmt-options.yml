name: Test tmt plan filter and context options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify dist/index.js exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/dist/index.js" ]; then
            echo "FAIL: dist/index.js not found"
            exit 1
          fi
          echo "PASS: dist/index.js exists"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'fake-api-key-for-testing'
          git_url: 'https://github.com/example/repo'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          tmt_plan_filter: 'tag: tier1'
          tmt_context: 'distro=fedora;arch=x86_64'
          tmt_path: './tests'
          copr_artifacts: 'copr:copr.fedorainfracloud.org:user:project:123456'
          environment_settings: '{"post-install-script": "dnf install -y vim"}'
          create_github_summary: 'false'
          timeout: '5'

      - name: Assert action ran with tmt options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with tmt options, outcome=$OUTCOME"
