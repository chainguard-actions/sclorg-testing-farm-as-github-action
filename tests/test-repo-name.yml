name: Test repo_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          git_url: https://github.com/sclorg/testing-farm-as-github-action
          git_ref: main
          compose: Fedora-latest
          arch: x86_64
          repo_name: testing-farm-as-github-action
          repo_owner: sclorg
          tmt_plan_regex: /plans/
          timeout: '5'
      - name: Assert action ran and failed gracefully (invalid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REQUEST_ID: ${{ steps.action.outputs.request_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "request_id: $REQUEST_ID"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid API key"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -n "$REQUEST_ID" ]; then
              echo "PASS: action succeeded with request_id=$REQUEST_ID"
            else
              echo "FAIL: action succeeded but request_id is empty"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
