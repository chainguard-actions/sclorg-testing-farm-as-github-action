name: Test missing required api_key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action without api_key (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: ''
          git_url: https://github.com/teemtee/tmt
          git_ref: main
          compose: Fedora-latest
          timeout: '5'

      - name: Assert action failed due to missing api_key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when api_key is missing"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
