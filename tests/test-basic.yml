name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          api_url: https://api.dev.testing-farm.io/v0.1
          git_url: https://github.com/sclorg/testing-farm-as-github-action
          git_ref: main
          compose: Fedora-latest
          arch: x86_64
          repo_name: testing-farm-as-github-action
          pr_number: '1'
          commit_sha: abc1234def5678901234567890abcdef12345678
          timeout: '5'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
      - name: Assert action ran (may fail due to invalid API key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "request_id: ${{ steps.action.outputs.request_id }}"
          echo "request_url: ${{ steps.action.outputs.request_url }}"
          # The action is expected to fail with an invalid API key
          # We just verify it ran and produced some output or failed gracefully
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran as expected"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
