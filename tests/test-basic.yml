name: Test basic usage with plan inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          api_url: https://api.dev.testing-farm.io/v0.1
          git_url: https://github.com/sclorg/testing-farm-as-github-action
          git_ref: main
          tmt_plan_regex: '^/plans/basic'
          tmt_plan_filter: 'tag:tier1'
          repo_name: testing-farm-as-github-action
          compose: Fedora-latest
          arch: x86_64
          timeout: '5'
      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail due to invalid API key, but it must have been invoked
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
