name: Test basic usage with plan filters and hardware
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'fake-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          repo_name: 'testing-farm-as-github-action'
          tmt_plan_regex: '^/plans/basic'
          tmt_plan_filter: 'tag:basic'
          tmt_hardware: '{"memory": "8 GB"}'
          timeout: '5'
          create_github_summary: 'false'
      - name: Assert action ran (may fail due to invalid API key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "request_id: ${{ steps.action.outputs.request_id }}"
          echo "request_url: ${{ steps.action.outputs.request_url }}"
          # The action is expected to fail with a fake API key
          # We just verify it was invoked with the required inputs
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action was invoked"
          else
            echo "FAIL: action did not run"
            exit 1
          fi
