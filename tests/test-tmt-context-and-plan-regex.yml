name: Test tmt context and plan regex inputs
on:
  workflow_dispatch:

jobs:
  test-tmt-context-plan-regex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with tmt_context and tmt_plan_regex (expect failure due to invalid API key)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/actions/checkout'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          tmt_context: 'distro=fedora;arch=x86_64'
          tmt_plan_regex: '/plans/basic'
          variables: 'MY_VAR=hello;ANOTHER_VAR=world'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'

      - name: Assert action failed as expected (inputs were parsed, API key rejected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with tmt_context and tmt_plan_regex inputs parsed"
