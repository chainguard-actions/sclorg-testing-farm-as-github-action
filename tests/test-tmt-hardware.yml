name: Test tmt_hardware JSON input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          tmt_hardware: '{"memory": ">=8 GB"}'
          create_github_summary: 'false'
          timeout: '1'

      - name: Assert action failed on API call (not on tmt_hardware JSON parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API call with invalid key), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly parsed tmt_hardware JSON and failed at API call stage"
