name: Test tmt_hardware JSON input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts and parses tmt_hardware as a JSON string.
      # The action uses JSON.parse() on this input and routes to unsafeNewRequest().
      # With an invalid API key, the action will fail at API auth, but if it
      # reaches that point, the JSON hardware spec was parsed correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'test-key-hardware'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          tmt_hardware: '{"memory": ">=8 GB", "cpu": {"processors": ">=2"}}'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'

      - name: Assert action failed at API level (tmt_hardware JSON was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API auth error), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted tmt_hardware JSON and failed at API level as expected"
