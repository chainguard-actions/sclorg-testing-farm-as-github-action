name: Test pull request scenario with extended inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          api_url: https://api.dev.testing-farm.io/v0.1
          git_url: https://github.com/sclorg/testing-farm-as-github-action
          git_ref: main
          compose: Fedora-latest
          arch: x86_64
          tmt_plan_filter: 'tag: basic'
          tmt_hardware: '{"memory": "8 GB"}'
          pr_number: '42'
          commit_sha: 'abc1234def5678901234567890123456789012ab'
          repo_name: testing-farm-as-github-action
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
          timeout: '1'
      - name: Assert action ran (may fail due to fake API key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "request_id: ${{ steps.action.outputs.request_id }}"
          echo "request_url: ${{ steps.action.outputs.request_url }}"
          echo "PASS: action step executed (expected failure with fake API key)"
