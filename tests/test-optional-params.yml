name: Test invocation with optional parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with optional parameters (expect failure due to fake key)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          api_url: https://api.dev.testing-farm.io/v0.1
          tf_scope: public
          git_url: https://github.com/teemtee/tmt
          git_ref: main
          compose: Fedora-latest
          arch: x86_64
          tmt_plan_regex: /plans/features/basic
          tmt_context: 'distro=fedora;arch=x86_64'
          variables: 'MY_VAR=hello;ANOTHER_VAR=world'
          copr_artifacts: ''
          environment_settings: '{}'
          pipeline_settings: '{}'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
          timeout: '5'

      - name: Assert action ran with optional params
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome with optional params"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
