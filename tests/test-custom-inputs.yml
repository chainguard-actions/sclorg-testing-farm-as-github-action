name: Test custom inputs with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'Fedora-38'
          arch: 'x86_64'
          tmt_plan_regex: '/plans/basic'
          tmt_context: 'distro=fedora-38;arch=x86_64'
          variables: 'VAR1=value1;VAR2=value2'
          copr_artifacts: ''
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
          timeout: '1'
          environment_settings: '{}'
          pipeline_settings: '{}'

      - name: Assert action ran and failed due to API error (not a JS crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (invalid API key), not succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid API key, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key when using custom inputs (outcome=$OUTCOME)"
