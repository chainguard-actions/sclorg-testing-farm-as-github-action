name: Test custom inputs processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom inputs (expect failure at API call)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          tf_scope: 'public'
          git_url: 'https://github.com/actions/checkout'
          git_ref: 'main'
          tmt_plan_regex: '/plans/basic'
          tmt_context: 'distro=fedora;arch=x86_64'
          tmt_path: '.'
          compose: 'Fedora-39'
          arch: 'x86_64'
          variables: 'MY_VAR=hello;ANOTHER_VAR=world'
          copr_artifacts: ''
          create_issue_comment: 'false'
          update_pull_request_status: 'false'
          create_github_summary: 'false'
          environment_settings: '{}'
          pipeline_settings: '{}'
          timeout: '1'

      - name: Assert action failed at API call (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at API call stage (inputs were parsed successfully)"
