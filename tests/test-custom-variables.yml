name: Test custom variables and tmt_context inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts and parses semicolon-separated variables
      # and tmt_context inputs. The action will fail at API auth (invalid key),
      # but the input parsing happens before the API call, so if the action
      # fails with an API error rather than an input parsing error, the inputs
      # were accepted correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'test-key-variables'
          api_url: 'https://api.dev.testing-farm.io/v0.1'
          git_url: 'https://github.com/sclorg/testing-farm-as-github-action'
          git_ref: 'main'
          compose: 'Fedora-latest'
          arch: 'x86_64'
          variables: 'MY_VAR=hello;ANOTHER_VAR=world'
          tmt_context: 'distro=fedora;arch=x86_64'
          tmt_path: '.'
          copr_artifacts: ''
          environment_settings: '{}'
          pipeline_settings: '{}'
          create_github_summary: 'false'
          update_pull_request_status: 'false'
          create_issue_comment: 'false'
          timeout: '480'

      - name: Assert action failed at API level (inputs were valid)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API auth error with valid inputs), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted custom variables and failed at API level as expected"
